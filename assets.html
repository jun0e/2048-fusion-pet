<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048 Siege assets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2b1d2e;
        --cream: #fffaf2;
        --bg: #17203f;
        --panel: #1f2a55;
        --line: #34407a;
        --soft: #c9d3ff;
        --muted: #8f9bd0;
        --p0: #ff6fa6;
        --p1: #ffcf4a;
        --p2: #7fd6ff;
        --p3: #a8e063;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--cream);
        font: 700 14px/1.45 Nunito, system-ui, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(23, 32, 63, 0.96);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--line);
        padding: 14px 20px 10px;
      }
      h1 {
        font: 800 24px/1.1 'Baloo 2', sans-serif;
        margin: 0;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        color: var(--soft);
        font-size: 13px;
        margin: 4px 0 10px;
      }
      .stats b {
        color: var(--cream);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .group {
        display: flex;
        gap: 4px;
        background: #121a36;
        border-radius: 999px;
        padding: 3px;
      }
      .chip {
        font: 800 12px/1 'Baloo 2', sans-serif;
        border: 0;
        background: transparent;
        color: var(--soft);
        border-radius: 999px;
        padding: 6px 10px 4px;
        cursor: pointer;
      }
      .chip.on {
        background: var(--cream);
        color: var(--ink);
      }
      input[type='search'] {
        font: 700 13px Nunito, sans-serif;
        background: #121a36;
        color: var(--cream);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 12px;
        width: 220px;
      }
      label.toggle {
        display: flex;
        gap: 6px;
        align-items: center;
        color: var(--soft);
        font-size: 13px;
        cursor: pointer;
      }
      main {
        padding: 6px 20px 40px;
      }
      section h2 {
        font: 800 19px/1.2 'Baloo 2', sans-serif;
        margin: 22px 0 2px;
        color: #ffe27a;
      }
      section h2 small {
        font: 700 13px Nunito, sans-serif;
        color: var(--muted);
        margin-left: 8px;
      }
      section p.note {
        margin: 0 0 10px;
        color: var(--soft);
        font-size: 13px;
        max-width: 980px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 10px;
      }
      .card {
        background: var(--panel);
        border-radius: 14px;
        box-shadow: inset 0 0 0 1px var(--line);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .thumbs {
        display: flex;
        gap: 4px;
        padding: 8px;
        min-height: 136px;
        background: repeating-conic-gradient(#2a3566 0% 25%, #253060 0% 50%) 0 / 16px 16px;
        align-items: flex-end;
        justify-content: center;
      }
      .thumb {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        flex: 1;
        min-width: 0;
      }
      .thumb canvas,
      .thumb img {
        max-width: 100%;
        height: 112px;
        object-fit: contain;
      }
      .thumb.px canvas {
        image-rendering: pixelated;
      }
      .thumb span {
        font-size: 10px;
        color: var(--soft);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }
      .placeholder {
        height: 112px;
        display: grid;
        place-items: center;
        color: var(--muted);
        font: 800 12px 'Baloo 2', sans-serif;
        text-align: center;
        padding: 0 8px;
      }
      .body {
        padding: 8px 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .title {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        align-items: flex-start;
      }
      .title b {
        font: 800 14px/1.2 'Baloo 2', sans-serif;
      }
      .pri {
        font: 800 11px/1 'Baloo 2', sans-serif;
        color: var(--ink);
        border-radius: 999px;
        padding: 3px 7px 2px;
        flex: none;
      }
      .id {
        font: 600 11px ui-monospace, Menlo, monospace;
        color: var(--muted);
      }
      .desc {
        font-size: 12px;
        color: var(--soft);
      }
      .meta {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 1px 8px;
        font-size: 11px;
        color: var(--soft);
        margin-top: 2px;
      }
      .meta dt {
        color: var(--muted);
      }
      .meta dd {
        margin: 0;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>2048 Siege: full asset list</h1>
      <div class="stats" id="stats"></div>
      <div class="controls">
        <div class="group" id="cats"></div>
        <div class="group" id="pris"></div>
        <input type="search" id="q" placeholder="Search name, id, element…" />
        <label class="toggle"><input type="checkbox" id="px" /> show pixel versions</label>
      </div>
    </header>
    <main id="main"></main>
    <script type="module" src="/src/art/assets-page.js"></script>
  </body>
</html>
