<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1f3352" />
    <meta name="description" content="Merge blocks into turrets and hold the siege." />
    <!-- installed from the home screen: full screen, portrait (public/manifest.webmanifest) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="2048 Fusion Pet" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>2048 Fusion Pet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* loading screen: the game's navy, until the first frame is drawn (then main.js hides it; a failure shows it again) */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #2a4466, #1f3352 55%, #15223a);
        color: #fffaf2;
        font-family: 'Baloo 2', system-ui, sans-serif;
        transition: opacity 0.4s ease;
      }
      /* hidden once the fade ends: no Tab stop, nothing for a screen reader; a failure shows it at once */
      #boot.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.4s ease, visibility 0s linear 0.4s;
      }
      .boot-card {
        display: grid;
        justify-items: center;
        gap: 14px;
        text-align: center;
      }
      .boot-logo {
        display: grid;
        place-items: center;
        width: 120px;
        height: 104px;
        border-radius: 24px;
        background: #fffaf2;
        border: 3px solid #2b1d2e;
        box-shadow:
          inset 0 -6px 0 #e6d6be,
          0 6px 0 #2b1d2e99;
        color: #2b1d2e;
        font-size: 40px;
        font-weight: 800;
      }
      .boot-name {
        margin-top: 6px;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.06em;
      }
      .boot-bar {
        width: 140px;
        height: 8px;
        border-radius: 999px;
        background: #fffaf2;
        border: 2px solid #2b1d2e;
        overflow: hidden;
      }
      .boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #2b1d2e;
        animation: boot-slide 1.1s ease-in-out infinite alternate;
      }
      #boot.done .boot-bar i {
        animation-play-state: paused; /* stopped, not removed: the bar does not jump while the screen fades */
      }
      @keyframes boot-slide {
        from { transform: translateX(-40%); }
        to { transform: translateX(190%); }
      }
      .boot-msg {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-weight: 700;
        font-size: 16px;
        opacity: 0.85;
      }
      .boot-actions {
        display: none;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      #boot.failed .boot-actions,
      #boot.slow .boot-actions {
        display: flex;
      }
      .boot-retry,
      .boot-new {
        min-height: 48px;
        padding: 12px 28px;
        border: 2px solid #2b1d2e;
        border-radius: 18px;
        background: #bfe3bd;
        box-shadow: 0 3px 0 #2b1d2e59;
        color: #2b1d2e;
        font: 800 17px system-ui, sans-serif;
      }
      #boot:not(.failed) .boot-new {
        display: none; /* New run drops the saved run: for a failure, not for a slow network */
      }
      #boot.failed .boot-bar {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-card">
        <div class="boot-logo">2048</div>
        <div class="boot-name">FUSION PET</div>
        <div class="boot-bar"><i></i></div>
        <p class="boot-msg">Loading…</p>
        <div class="boot-actions">
          <button class="boot-retry" type="button">Try again</button>
          <button class="boot-new" type="button">New run</button>
        </div>
      </div>
    </div>
    <script>
      // Try again reloads; it also shows if loading takes over 20 s (a stuck network) and the game is not up yet
      document.querySelector('.boot-retry').addEventListener('click', () => location.reload());
      // New run (the failure screen only) also drops the saved run, in case the run is what breaks the game.
      // Wired here so it works even when main.js failed to load; main.js saves nothing after a failure.
      // 'siege:run' is RESUME_KEY in src/ux/resume.js.
      document.querySelector('.boot-new').addEventListener('click', () => {
        try {
          localStorage.removeItem('siege:run');
        } catch {}
        location.reload();
      });
      setTimeout(() => document.querySelector('#boot:not(.done)')?.classList.add('slow'), 20000);
    </script>
    <script>
      // The loading screen's words, in the game's language before the game loads (the single file takes a
      // moment to parse). The tables are the source (src/i18n: boot.loading, boot.retry, boot.newRun), and
      // the language is picked as src/i18n/index.js picks it (startLang): the address (#lang-vi, chosen
      // while storage was blocked), the saved choice, the phone's first language the game has.
      // test/i18n.test.js runs this script against both. A script of its own, after the wiring above:
      // nothing here, not even a syntax error, can stop Try again and New run.
      const BOOT_WORDS = {
        en: ['Loading…', 'Try again', 'New run'],
        vi: ['Đang tải…', 'Thử lại', 'Ván mới'],
      };
      try {
        const codes = Object.keys(BOOT_WORDS);
        const known = (code) => codes.indexOf(code) >= 0;
        const m = /^#lang-([a-z]+)$/.exec(location.hash);
        let lang = m && known(m[1]) ? m[1] : null;
        if (!lang) {
          try {
            const saved = localStorage.getItem('siege:lang');
            if (known(saved)) lang = saved;
          } catch {}
        }
        if (!lang) {
          const phone = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
          for (const l of phone) {
            const code = String(l).toLowerCase().split(/[-_]/)[0];
            if (known(code)) {
              lang = code;
              break;
            }
          }
        }
        lang = lang || 'en';
        document.documentElement.lang = lang;
        const words = BOOT_WORDS[lang];
        document.querySelector('.boot-msg').textContent = words[0];
        document.querySelector('.boot-retry').textContent = words[1];
        document.querySelector('.boot-new').textContent = words[2];
      } catch {}
    </script>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
