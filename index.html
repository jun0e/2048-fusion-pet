<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1c2547" />
    <meta name="description" content="Merge blocks into turrets and hold the siege." />
    <!-- installed from the home screen: full screen, portrait (public/manifest.webmanifest) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="2048 Siege" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>2048 Siege</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* loading screen: the game's navy, until the first frame is drawn (main.js removes it) */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: #1c2547;
        color: #fffaf2;
        font-family: 'Baloo 2', system-ui, sans-serif;
        transition: opacity 0.4s ease;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-card {
        display: grid;
        justify-items: center;
        gap: 14px;
        text-align: center;
      }
      .boot-logo {
        display: grid;
        place-items: center;
        width: 120px;
        height: 104px;
        border-radius: 28px;
        background: #ffd34a;
        box-shadow: 0 10px 0 #c47a10;
        color: #4a2e12;
        font-size: 40px;
        font-weight: 800;
      }
      .boot-name {
        margin-top: 6px;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.06em;
      }
      .boot-bar {
        width: 140px;
        height: 8px;
        border-radius: 999px;
        background: #ffffff22;
        overflow: hidden;
      }
      .boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #ffd34a;
        animation: boot-slide 1.1s ease-in-out infinite alternate;
      }
      @keyframes boot-slide {
        from { transform: translateX(-40%); }
        to { transform: translateX(190%); }
      }
      .boot-msg {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-weight: 700;
        font-size: 15px;
        opacity: 0.8;
      }
      .boot-retry {
        display: none;
        padding: 12px 28px;
        border: 0;
        border-radius: 16px;
        background: #bfe3bd;
        color: #2b1d12;
        font: 800 17px system-ui, sans-serif;
      }
      #boot.failed .boot-retry,
      #boot.slow .boot-retry {
        display: block;
      }
      #boot.failed .boot-bar {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-card">
        <div class="boot-logo">2048</div>
        <div class="boot-name">SIEGE</div>
        <div class="boot-bar"><i></i></div>
        <p class="boot-msg">Loading…</p>
        <button class="boot-retry" type="button">Try again</button>
      </div>
    </div>
    <script>
      // Try again reloads; it also shows if loading takes over 20 s (a stuck network)
      document.querySelector('.boot-retry').addEventListener('click', () => location.reload());
      setTimeout(() => document.getElementById('boot')?.classList.add('slow'), 20000);
    </script>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
